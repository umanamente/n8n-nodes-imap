name: Test NPM Package Installation

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Published package version; leave empty to pack this workflow ref'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js compatibility target'
        required: true
        default: '24.0.0'
        type: choice
        options:
          - '20.19.0'
          - '22.16.0'
          - '24.0.0'

permissions:
  contents: read

jobs:
  pack:
    name: Prepare exact package tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup build toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Verify build toolchain
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - name: Pack source ref
        if: inputs.package_version == ''
        run: |
          npm ci
          npm run prepublishOnly
          mkdir package-artifact
          npm pack --pack-destination package-artifact
      - name: Fetch published package tarball
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          mkdir package-artifact
          npm pack "n8n-nodes-imap@${PACKAGE_VERSION}" --pack-destination package-artifact
      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-under-test
          path: package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  install:
    name: Install on Node.js ${{ inputs.node_version }}
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Select compatible n8n-workflow
        id: compatibility
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          case "$NODE_VERSION" in
            20.19.0) echo "workflow=1.95.0" >> "$GITHUB_OUTPUT" ;;
            22.16.0) echo "workflow=2.16.0" >> "$GITHUB_OUTPUT" ;;
            24.0.0) echo "workflow=2.38.1" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Download exact package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-under-test
          path: package-artifact
      - name: Install package and peer dependency
        env:
          N8N_WORKFLOW_VERSION: ${{ steps.compatibility.outputs.workflow }}
        run: |
          mkdir consumer
          cd consumer
          npm init --yes
          npm install --no-save "n8n-workflow@${N8N_WORKFLOW_VERSION}" ../package-artifact/*.tgz
          npm ls n8n-nodes-imap n8n-workflow
      - name: Verify module loading
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [ -z "$PACKAGE_VERSION" ]; then
            node scripts/verify-consumer-package.js consumer/node_modules/n8n-nodes-imap --expect-current-contract
          else
            node scripts/verify-consumer-package.js consumer/node_modules/n8n-nodes-imap
          fi
      - name: Audit package-owned runtime dependencies
        run: |
          mkdir runtime-audit
          cd runtime-audit
          npm init --yes
          npm install --omit=peer ../package-artifact/*.tgz
          npm audit --omit=dev --audit-level=low
