name: Coverage Comment

on:
  workflow_run:
    workflows: ['Test']
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  coverage-comment:
    name: Publish trusted coverage result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Validate workflow run context
        id: context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event === 'push' && run.head_branch === 'master' && run.head_repository.full_name === context.repo.owner + '/' + context.repo.repo) {
              core.setOutput('kind', 'master');
              return;
            }
            if (run.event !== 'pull_request' || run.pull_requests.length !== 1) {
              core.notice('The completed run is neither a master push nor an unambiguous pull request run.');
              return;
            }

            const number = run.pull_requests[0].number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pullRequest.head.repo?.full_name !== run.head_repository.full_name || pullRequest.head.sha !== run.head_sha) {
              core.notice('The pull request head changed or does not match the workflow run; skipping a stale coverage comment.');
              return;
            }

            core.setOutput('kind', 'pull-request');
            core.setOutput('pull_request_number', String(number));
      - name: Download coverage from the validated run
        if: steps.context.outputs.kind != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: coverage-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read coverage summary as data
        if: steps.context.outputs.kind != ''
        id: coverage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage-artifact/coverage-summary.json', 'utf8'));
            const metrics = ['lines', 'statements', 'functions', 'branches'];
            const validated = {};
            for (const metric of metrics) {
              const value = summary.total?.[metric];
              const percentage = value?.pct;
              const total = value?.total;
              const covered = value?.covered;
              if (
                typeof percentage !== 'number' || !Number.isFinite(percentage) || percentage < 0 || percentage > 100 ||
                !Number.isSafeInteger(total) || total < 0 ||
                !Number.isSafeInteger(covered) || covered < 0 || covered > total
              ) {
                core.setFailed(`Invalid ${metric} coverage value`);
                return;
              }
              validated[metric] = { percentage: percentage.toFixed(2), total, covered };
            }
            for (const metric of metrics) {
              const value = validated[metric];
              core.setOutput(metric, value.percentage);
              core.setOutput(`${metric}_detail`, `${value.percentage}% (${value.covered}/${value.total})`);
            }
            const total = Number(summary.total.lines.pct);
            core.setOutput('color', total >= 90 ? 'brightgreen' : total >= 80 ? 'green' : total >= 70 ? 'yellowgreen' : 'orange');
      - name: Create or update pull request coverage comment
        if: steps.context.outputs.kind == 'pull-request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_REQUEST_NUMBER: ${{ steps.context.outputs.pull_request_number }}
          LINES_DETAIL: ${{ steps.coverage.outputs.lines_detail }}
          STATEMENTS_DETAIL: ${{ steps.coverage.outputs.statements_detail }}
          FUNCTIONS_DETAIL: ${{ steps.coverage.outputs.functions_detail }}
          BRANCHES_DETAIL: ${{ steps.coverage.outputs.branches_detail }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- n8n-nodes-imap-coverage -->';
            const rawReport = fs.readFileSync('coverage-artifact/coverage.txt', 'utf8');
            if (!rawReport.trim() || rawReport.length > 50000 || /[\0-\x08\x0B\x0C\x0E-\x1F\x7F]/.test(rawReport)) {
              throw new Error('Invalid coverage text report');
            }
            const escapedReport = rawReport.trim().replace(/[&<>]/g, (character) => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
            })[character]);
            const body = `${marker}\n## Test coverage\n\n| Lines | Statements | Branches | Functions |\n| ---: | ---: | ---: | ---: |\n| ${process.env.LINES_DETAIL} | ${process.env.STATEMENTS_DETAIL} | ${process.env.BRANCHES_DETAIL} | ${process.env.FUNCTIONS_DETAIL} |\n\n<details><summary>Coverage by file</summary>\n\n<pre>${escapedReport}</pre>\n</details>\n\nTested commit: \`${process.env.HEAD_SHA}\``;
            const issue_number = Number(process.env.PULL_REQUEST_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
      - name: Create coverage badge for master
        if: steps.context.outputs.kind == 'master'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 3aec0274e0d5f029ab76a16627825c67
          filename: n8n-nodes-imap-coverage-badge.svg
          label: Coverage
          message: ${{ steps.coverage.outputs.lines }}%
          color: ${{ steps.coverage.outputs.color }}
