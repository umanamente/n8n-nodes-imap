name: Test

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - name: Install dependencies
        run: npm ci
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures
      - name: Audit the complete dependency tree
        run: npm audit --audit-level=low
      - name: Verify build and package
        run: npm run prepublishOnly
      - name: Run Jest tests with coverage
        run: npm run test:coverage
      # workflow_run uses the handler from the default branch. Keep this compatibility
      # artifact while the validated handler in this change is not yet live there.
      - name: Save PR number for coverage handoff
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "${{ github.event.pull_request.number }}" > pr_number.txt
      - name: Pack the exact tested package
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
          if-no-files-found: error
      - name: Upload PR number for coverage handoff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-number
          path: pr_number.txt
          retention-days: 1
          if-no-files-found: error
      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: package-artifact/*.tgz
          retention-days: 1
          if-no-files-found: error

  n8n-smoke:
    name: ${{ matrix.target }} / Node.js ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Package minimum peer
            node: '20.19.0'
            n8n: ''
            workflow: '1.95.0'
          - target: n8n 1.98.0
            node: '22.22.0'
            n8n: '1.98.0'
            workflow: '1.95.0'
          - target: n8n 2.16.0
            node: '22.16.0'
            n8n: '2.16.0'
            workflow: '2.16.0'
          - target: n8n 2.38.7
            node: '24.0.0'
            n8n: '2.38.7'
            workflow: '2.38.1'
    steps:
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - name: Install the exact package with its compatibility target
        env:
          N8N_VERSION: ${{ matrix.n8n }}
          N8N_WORKFLOW_VERSION: ${{ matrix.workflow }}
        run: |
          mkdir consumer
          cd consumer
          npm init --yes
          if [ -n "$N8N_VERSION" ]; then
            npm install --no-save "n8n@${N8N_VERSION}" "n8n-workflow@${N8N_WORKFLOW_VERSION}" ../package-artifact/*.tgz
          else
            npm install --no-save "n8n-workflow@${N8N_WORKFLOW_VERSION}" ../package-artifact/*.tgz
          fi
          npm ls n8n-nodes-imap n8n-workflow
      - name: Verify resolved peer and load node metadata
        run: |
          test "$(node -p "require('./consumer/node_modules/n8n-workflow/package.json').version")" = "${{ matrix.workflow }}"
          node scripts/verify-consumer-package.js consumer/node_modules/n8n-nodes-imap --expect-current-contract
      - name: Verify n8n CLI
        if: matrix.n8n != ''
        run: test "$(./consumer/node_modules/.bin/n8n --version)" = "${{ matrix.n8n }}"
